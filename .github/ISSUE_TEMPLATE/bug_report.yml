name: Bug report
description: Something in Wobbo doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it too?
      description: The steps that lead to it, as far as you know them.
      placeholder: |
        1. Start two Claude Code sessions
        2. ...
  - type: input
    id: version
    attributes:
      label: Wobbo version
      description: Shown in Finder under Wobbo → Get Info.
      placeholder: "0.2.4"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 27.1, MacBook Pro with Apple silicon"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does the session run?
      multiple: true
      options:
        - Claude Code in a terminal
        - Claude Code in the Claude desktop app (Code tab)
        - Claude Desktop chat
        - Something else
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: >
        The end of `~/Library/Application Support/Wobbo/logs/godot.log`. It names your
        sessions and project folders, so remove what you'd rather not share.
      render: text
