name: Idea
description: Something Wobbo could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with?
      description: The situation where you miss it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What Wobbo would do. Rough is fine.
    validations:
      required: true
